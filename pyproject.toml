[project]
name = "all-round-operations-agent"
version = "0.1.0"
description = "Amazon operations MVP with CSV imports, PostgreSQL metrics, rule alerts, LangGraph agents, and Feishu sync."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
