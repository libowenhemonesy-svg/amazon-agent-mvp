[package]
name = "amazon-agent"
version = "0.1.0"
description = "Amazon Agent 运营分析桌面端"
authors = ["Amazon Agent"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
