<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Creative Studio · 视觉方案</title>
  <style>
    :root{color-scheme:dark;--bg:#111419;--panel:#191d24;--line:#2d333d;--muted:#8b95a7;--text:#edf1f7;--lime:#c7fb22;--blue:#3f8cff;--soft:#222933}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px/1.45 Inter,"Microsoft YaHei",sans-serif;color:var(--text);min-width:1120px}.top{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:16px;background:#161a20}.brand{font-weight:800;letter-spacing:.3px;background:var(--lime);color:#142000;padding:5px 10px;border-radius:3px}.crumb{color:var(--muted)}.spacer{flex:1}.top button,.icon{border:1px solid var(--line);background:#20252d;color:var(--text);border-radius:4px;padding:5px 9px}.workspace{display:grid;grid-template-columns:318px minmax(560px,1fr) 308px;height:calc(100vh - 48px);min-height:680px}.left,.right{background:var(--panel);border-right:1px solid var(--line);overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}.section{padding:12px;border-bottom:1px solid var(--line)}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px}.field{margin:0 0 10px}.field label{font-size:11px;color:#b8c0cd;display:flex;justify-content:space-between;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#11151b;border:1px solid #353c48;border-radius:4px;color:var(--text);padding:8px;font:inherit}.field textarea{height:94px;resize:none}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);padding:8px 12px}.tab{font-size:12px;color:var(--muted);padding:5px 7px}.tab.on{color:var(--text);border-bottom:2px solid var(--lime)}.preset{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{border:1px solid #353c48;background:#20262f;border-radius:4px;padding:7px;color:#cdd4de}.chip.on{border-color:var(--lime);color:var(--lime);background:#253018}.range{display:flex;align-items:center;gap:8px}.range input{accent-color:var(--lime);padding:0}.canvas-wrap{background-color:#20252d;background-image:linear-gradient(45deg,#252b35 25%,transparent 25%),linear-gradient(-45deg,#252b35 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252b35 75%),linear-gradient(-45deg,transparent 75%,#252b35 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:flex;flex-direction:column}.canvasbar{height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#171b21}.canvasbar .title{font-weight:650}.canvas{margin:auto;width:min(66vh,58vw);aspect-ratio:1/1;background:linear-gradient(145deg,#eaf4f5 0%,#d3d9d7 53%,#a0aba6 100%);box-shadow:0 18px 36px #0008;position:relative;overflow:hidden}.safe{position:absolute;inset:7%;border:1px dashed #ffffffaa}.product{position:absolute;left:26%;top:15%;width:49%;height:72%;border-radius:34% 34% 21% 21%;background:linear-gradient(100deg,#bd5c24,#e69c4e 35%,#f1cb8c 55%,#b95320);box-shadow:inset -25px -10px 25px #63250d55,12px 22px 28px #26312b66}.product:before{content:"";position:absolute;background:#55311c;width:54%;height:10%;left:23%;top:-7%;border-radius:12px}.product:after{content:"";position:absolute;left:18%;right:18%;top:43%;height:18%;border:2px solid #7d351a;border-radius:5px;box-shadow:0 0 0 7px #f0bf7077}.canvas-note{position:absolute;bottom:12px;left:12px;background:#101319bb;color:#eaf0ee;padding:6px 8px;border-radius:3px;font-size:11px}.main-actions{display:flex;gap:8px;margin-left:auto}.primary{border:0;border-radius:4px;background:var(--lime);color:#101a00;font-weight:800;padding:7px 14px}.board-head{display:flex;align-items:center;gap:8px}.board-head strong{font-size:13px}.count{margin-left:auto;color:var(--muted);font-size:11px}.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.asset{height:61px;border:1px solid #3b4350;border-radius:3px;background:linear-gradient(140deg,#d3e9e4,#708d87 48%,#294b44);position:relative}.asset:nth-child(2n){background:linear-gradient(140deg,#eee5d2,#b9a785 50%,#504735)}.asset:nth-child(3n){background:linear-gradient(140deg,#d0d8eb,#63769b 50%,#1e2a43)}.asset.sel{outline:2px solid var(--lime);outline-offset:-2px}.layer{display:flex;align-items:center;gap:8px;padding:8px 3px;border-bottom:1px solid #292f38}.eye{color:var(--muted)}.thumb{height:24px;width:24px;border-radius:2px;background:#b96d34}.queue{position:fixed;bottom:16px;left:334px;background:#1b2028;border:1px solid #3a414d;border-radius:6px;box-shadow:0 12px 28px #0007;padding:10px 13px;width:300px}.queue b{font-size:12px}.progress{height:4px;background:#303744;border-radius:4px;margin-top:8px}.progress i{display:block;width:64%;height:100%;background:var(--blue);border-radius:4px}.toolrail{position:absolute;left:18px;top:92px;z-index:3;width:38px;background:#171b21;border:1px solid #39414c;border-radius:6px;overflow:hidden}.tool{height:37px;display:grid;place-items:center;border-bottom:1px solid #303743;color:#aeb7c6;font-size:16px}.tool.on{background:#334524;color:var(--lime)}.product.selected{outline:2px solid var(--lime);outline-offset:8px}.handle{position:absolute;width:9px;height:9px;background:var(--lime);right:-13px;bottom:-13px;border-radius:1px}.edit-pills{display:flex;flex-wrap:wrap;gap:6px}.edit-pills button{background:#222934;border:1px solid #38414d;color:#d9e0eb;padding:6px 7px;border-radius:3px;font-size:11px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mini-grid label{font-size:11px;color:var(--muted)}
    .canvas-edit-bar{display:none}.right .section:nth-child(2){display:block}.queue{display:none}.toolrail{position:fixed;z-index:5;left:calc(318px + (100vw - 626px)/2 - 145px);top:auto;bottom:18px;width:auto;display:flex;border-radius:6px;box-shadow:0 12px 28px #0008}.tool{width:39px;border-bottom:0;border-right:1px solid #303743}.tool:last-child{border-right:0}
  </style>
</head>
<body>
  <header class="top"><span class="brand">AMZ Studio</span><span class="crumb">创意项目 / 收纳盒 · US / 主图方案</span><span class="spacer"></span><button>↶</button><button>↷</button><button>保存草稿</button><button>导出</button></header>
  <main class="workspace">
    <aside class="left">
      <div class="tabs"><span class="tab on">创作</span><span class="tab">提示词库</span><span class="tab">合规检查</span></div>
      <section class="section"><h3>图片用途</h3><div class="preset"><div class="chip on">白底主图</div><div class="chip">生活场景</div><div class="chip">卖点信息图</div><div class="chip">A+ 横幅</div></div></section>
      <section class="section"><h3>产品与参考图</h3><div class="field"><label>关联商品 <span>SKU: STG-001</span></label><select><option>收纳盒 · 米白色 · 3 件套</option></select></div><div class="field"><label>参考图</label><div class="chip">＋ 上传产品白底图</div></div></section>
      <section class="section"><h3>创作提示词</h3><div class="field"><label>场景与卖点 <span>沉淀提示词 ▾</span></label><textarea>Amazon 主图，纯白背景，产品居中展示，真实材质，清晰边缘，画面干净。突出可堆叠收纳设计。</textarea></div><div class="field"><label>排除内容</label><input value="文字、水印、logo、人物、杂乱道具"></div></section>
      <section class="section"><h3>输出设置</h3><div class="field"><label>画布规格</label><select><option>主图 · 2000 × 2000 · 1:1</option></select></div><div class="field"><label>生成变体 <span>4 张</span></label><div class="range"><input type="range" value="55"><span>4</span></div></div><div class="field"><label>创意强度 <span>平衡</span></label><div class="range"><input type="range" value="46"></div></div><button class="primary" style="width:100%">生成 4 个变体</button></section>
    </aside>
    <section class="canvas-wrap"><div class="canvasbar"><span class="title">主图画布</span><span class="crumb">2000 × 2000</span><span class="spacer"></span><button class="icon">−</button><span>100%</span><button class="icon">＋</button><div class="main-actions"><button class="icon">安全区</button><button class="icon">裁剪</button></div></div><div class="toolrail"><div class="tool on">↖</div><div class="tool">✂</div><div class="tool">◌</div><div class="tool">⌫</div><div class="tool">▧</div><div class="tool">T</div><div class="tool">▣</div></div><div class="canvas"><div class="safe"></div><div class="product selected"><i class="handle"></i></div><div class="canvas-note">Amazon 主图安全区 · 产品占比 74%</div></div></section>
    <aside class="right"><section class="section"><div class="board-head"><strong>素材库</strong><span class="count">12 项</span></div><div class="tabs" style="padding:8px 0"><span class="tab on">本次生成</span><span class="tab">项目素材</span></div><div class="asset-grid"><div class="asset sel"></div><div class="asset"></div><div class="asset"></div><div class="asset"></div><div class="asset"></div><div class="asset"></div></div></section><section class="section"><div class="board-head"><strong>编辑产品主体</strong><span class="count">智能修图</span></div><div class="edit-pills"><button>智能抠图</button><button>擦除物体</button><button>局部重绘</button><button>换背景</button><button>扩展画布</button><button>增强清晰度</button></div><div class="mini-grid" style="margin-top:10px"><label>缩放 <input type="range" value="60"></label><label>旋转 <input type="range" value="50"></label><label>亮度 <input type="range" value="55"></label><label>阴影 <input type="range" value="42"></label></div></section><section class="section"><div class="board-head"><strong>画布图层</strong><span class="count">3 层</span></div><div class="layer"><span class="eye">◉</span><span class="thumb"></span>产品主体 <span class="count">锁定</span></div><div class="layer"><span class="eye">◉</span><span class="thumb" style="background:#dce6e4"></span>背景</div><div class="layer"><span class="eye">◉</span><span class="thumb" style="background:#5a8ecb"></span>安全区辅助线</div></section><section class="section"><div class="board-head"><strong>检查结果</strong><span class="count" style="color:#c7fb22">通过</span></div><p style="color:var(--muted);margin:8px 0 0">白底合格 · 无文字 · 无水印 · 产品主体清晰</p></section></aside>
  </main><div class="queue"><b>生成队列</b><span class="count" style="float:right">1 个任务进行中</span><div style="margin-top:6px">白底主图 · 生成第 3 / 4 张</div><div class="progress"><i></i></div></div>
</body>
</html>
